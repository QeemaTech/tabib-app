name: tabib_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  easy_localization: ^3.0.8
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.2.2
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  pinput: ^6.0.2
  table_calendar: ^3.2.0
  injectable: ^3.0.0
  retrofit: ^4.9.2
  talker_dio_logger: ^5.1.20
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  
  
  
  country_code_picker: ^3.4.1
  skeletonizer: ^2.1.3
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.2
  socket_io_client: ^3.1.6
  


dev_dependencies:
  flutter_test:
    sdk: flutter
    
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.8
  json_serializable: ^6.14.1
  json_annotation: ^4.12.0


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/translations/en.json
    - assets/translations/ar.json

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf

  
  
